# 是否显示消息前缀（如 [幸运蟠桃]）
show_prefix: true
prefix: "&e[幸运蟠桃] "
# 占位符：%bonus%（本次加成）/%peach_health%（当前蟠桃血量）/%penalty%（损失）/%player%/%world%/%health%/%amount%/%count%/%type%/%error%/%worlds%
# 注意：消息模板请勿写裸 % 号（例如 100%），否则会被当成格式化占位符
success: "&a蟠桃血量 &e+%bonus% &7| &a当前蟠桃血量: &e%peach_health%"
fail: "&c什么也没发生... &7当前蟠桃血量: &e%peach_health%"
eat_save_failed: "&c数据保存失败，蟠桃已退回，请稍后再试或联系管理员。"
no_permission: "&c你没有权限执行此操作。"
give_success: "&a已将 %peach% x%amount% 发送给 %player%"
give_dropped: "&e背包已满，%amount% 个 %peach% &e已掉落在地上"
max_health_reached: "&c你的生命值已达巅峰，蟠桃已无法再提升。&7当前蟠桃血量: &e%peach_health%"
peach_health_limit_reached: "&c你的生命上限 &e%health% &c已超过 &e%limit%&c，无法食用 %peach%&c！"
reload_success: "&a插件配置已重载！"
get_health: "&f玩家 &e%player% &f当前的蟠桃加成生命值为: &a%health%"
set_health_success: "&a已将玩家 &e%player% &a的蟠桃加成生命值设置为: &e%health%"
death_penalty: "&c你死亡了，失去了 &e%penalty% &c点蟠桃血量！&7剩余蟠桃血量: &e%peach_health%"
death_cooldown: "&e你刚复活不久，本次死亡不扣除蟠桃血！"
world_disabled: "&c当前世界已屏蔽蟠桃血量加成，无法使用蟠桃！"
world_enter: "&e你进入了屏蔽世界，蟠桃血量加成已被暂时禁用。"
world_exit: "&a你离开了屏蔽世界，蟠桃血量加成已恢复。"
world_add: "&a已将世界 &e%world% &a添加到屏蔽列表。"
world_remove: "&a已将世界 &e%world% &a从屏蔽列表中移除。"
world_already_disabled: "&c世界 &e%world% &c已在屏蔽列表中。"
world_not_disabled: "&c世界 &e%world% &c不在屏蔽列表中。"
world_list: "&6当前屏蔽的世界列表: &e%worlds%"
world_max_health_set: "&a已将世界 &e%world% &a的最大生命值设置为 &e%health%"
world_max_health_removed: "&a已移除世界 &e%world% &a的最大生命值设置"
world_max_health_get: "&6世界 &e%world% &a的最大生命值为 &e%health%"
world_max_health_applied: "&a已应用世界 &e%world% &a的最大生命值设置"
world_max_health_not_set: "&c世界 &e%world% &c未设置最大生命值"
world_max_health_list: "&6当前设置最大生命值的世界列表:"
world_max_health_list_item: "&7- &e%world%&7: &a%health%"
world_max_health_not_enabled: "&c世界最大生命值功能未启用"
db_current_type: "&6当前数据库类型: &e%type%"
db_switching: "&e正在切换数据库类型为 &a%type%&e 并迁移数据，请稍候..."
db_switch_success: "&a数据库已成功切换为 &e%type% &a，共迁移 &e%count% &a条记录"
db_switch_success_empty: "&a数据库已成功切换为 &e%type%&a（无数据需要迁移）"
db_switch_failed: "&c数据库切换失败: &e%error%"
clear_health_success: "&a已清理玩家 &e%player% &a的非蟠桃血量加成"
clear_health_all: "&a已清理所有在线玩家（&e%count% &a人）的非蟠桃血量加成"
db_already_same_type: "&c当前已经是 %type% 类型，无需切换"
db_type_mismatch: "&c配置文件里的数据库类型是 %type%，但当前仍在使用原数据库；热重载不会迁移数据，请执行 &e/lp db <mysql|sqlite> &c切换。"
db_help:
  - "&6&l--- 数据库管理 ---"
  - "&e/lp db status &7- 查看当前数据库类型"
  - "&e/lp db mysql &7- 切换到 MySQL 并迁移数据"
  - "&e/lp db sqlite &7- 切换到 SQLite 并迁移数据"
help:
  - "&6&l--- 幸运蟠桃 帮助菜单 ---"
  - "&e/lp give <玩家> <ID> [数量] &7- 给玩家发放蟠桃"
  - "&e/lp gethealth <玩家> &7- 查看玩家当前的蟠桃生命加成"
  - "&e/lp sethealth <玩家> <数值> &7- 设置玩家的蟠桃生命加成"
  - "&e/lp clearhealth <玩家|all> &7- 清理非蟠桃血量加成"
  - "&e/lp reload &7- 重载配置文件"
  - "&e/lp backup <now|list|enable|disable> &7- 数据库备份管理"
  - "&e/lp world <add|remove|list> [世界] &7- 管理屏蔽世界列表"
  - "&e/lp world <setmax|getmax|listmax|removemax> [世界] [数值] &7- 管理世界最大生命值"
  - "&e/lp db <mysql|sqlite|status> &7- 切换数据库类型"
  - "&e/lp import <sqlite文件> &7- 导入旧 SQLite 数据到 MySQL"
  - "&e/lp help &7- 查看此帮助"
