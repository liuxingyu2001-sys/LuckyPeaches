# 共享配置目录（群组服多端共用，留空则使用插件数据目录）
# 所有服务器读取同一份 config.yml / messages.yml，修改后自动同步重载
shared_config_dir: ""
# 配置文件变更检测间隔（秒），0 = 禁用自动重载
config_poll_interval: 5

settings:
  # 调试模式
  debug: false
  # 登录时设置基础最大生命值（≤0 禁用）
  base_max_health: 20.0
  # 数据库配置
  database:
    # 数据库类型: sqlite 或 mysql
    type: sqlite
    # MySQL 配置（仅 type: mysql 时生效）
    # 使用 MySQL 时，玩家数据共享，配置从共享目录读取
    mysql:
      host: localhost
      port: 3306
      database: luckypeaches
      username: root
      password: ""
      table_prefix: "lp_"
      max_connections: 10
  # 本地备份设置
  database_backup:
    enabled: true
    backup_interval_hours: 1
    max_backups: 7
    backup_folder: "backups"
    format: yml

# 以下是 SQLite 模式的默认配置
# MySQL 模式下会从代理端自动同步，无需手动配置

  max_health_limit: 250
  vip_health_limits:
    vip: 10000
  death_penalty:
    enabled: true
    health_threshold: 200.0
    death_cooldown_ms: 5000
    restore_delay_ticks: 2
    penalty_groups:
      default:
        penalty_percentage: 0.01
        min_penalty: 1.0
        max_penalty: 200.0
      vip:
        penalty_percentage: 0.008
        min_penalty: 0.5
        max_penalty: 150.0
      svip:
        penalty_percentage: 0.005
        min_penalty: 0.2
        max_penalty: 100.0
  success_sound: ENTITY_PLAYER_LEVELUP
  fail_sound: BLOCK_GLASS_BREAK
  enable_particles: true
  health_scaling:
    enable: true
    scale: 20.0

world_integration:
  enabled: true
  disabled_worlds:
    - "world_pvp"
    - "world_arena"
  restore_full_health_on_enter: true
  restore_health_delay_ticks: 60
  peach_restore_delay_ticks: 60
  restore_full_health_on_exit: true

world_max_health:
  enabled: true
  worlds:
    pvp: 500.0

peaches:
  peach_1:
    display_name: "&6蟠桃"
    material: APPLE
    lore:
      - "&7一颗神奇的蟠桃"
      - "&e有 10% 概率增加 0.5 点生命上限"
    health_bonus: 0.5
    chance: 0.1
    custom_model_data: 0
  peach_2:
    display_name: "&d优质蟠桃"
    material: CHORUS_FRUIT
    lore:
      - "&7极其罕见的仙桃"
      - "&e有 50% 概率增加 1 点生命上限"
    health_bonus: 1.0
    chance: 0.5
    custom_model_data: 1
  peach_3:
    display_name: "&6极品蟠桃"
    material: GOLDEN_APPLE
    lore:
      - "&7一颗神奇的蟠桃"
      - "&e有 100% 概率增加 0.5 点生命上限"
    health_bonus: 0.5
    chance: 1.0
    custom_model_data: 2
  peach_4:
    display_name: "&6至尊蟠桃"
    material: GOLDEN_APPLE
    lore:
      - "&7至尊蟠桃"
      - "&e有 100% 概率增加 1 点生命上限"
    health_bonus: 1.0
    chance: 1.0
    custom_model_data: 3
