# 共享配置目录（群组服多端共用，留空则使用插件数据目录）
# 所有服务器读取同一份 config.yml / messages.yml / peaches.yml，修改后自动同步重载
shared_config_dir: ""
# 配置文件变更检测间隔（秒），0 = 禁用自动重载
config_poll_interval: 5

# Redis 跨服血量同步（群组服切服无感，可选）
# 开启后：退出/吃桃/死亡时把玩家最新血量写入 Redis，登录前预取并直接套用，
# 避免切服时因“先按本地旧血量进入、再异步校准”造成的血量跳变/受伤动画。
# Redis 不可用时自动回退到数据库同步；修改本节配置需重启服务器。
redis:
  enabled: false
  host: localhost
  port: 6379
  password: ""
  database: 0
  # key 前缀，多套群组服共用同一个 Redis 时用不同前缀隔离
  key_prefix: "luckypeaches:"
  # 连接/读写超时（毫秒）
  timeout_ms: 1000
  # 快照 TTL（秒），0 = 不过期；建议略大于一次切服耗时
  ttl_seconds: 600
  # 连接池
  max_total: 16
  max_idle: 8
  # 周期兜底上报在线玩家血量的间隔（秒），0 = 禁用
  flush_interval_seconds: 60

# 跨服生命同步委托给 SparrowSync（可选）
# true 且已安装 SparrowSync 时：本插件不再自己做跨服血量还原（不启用 Redis、
# 不还原 current_health），由 SparrowSync 负责最大生命值/当前血量/属性同步；
# 本插件的数据库仍作为蟠桃加成的权威与备份（登录后仅校准 peach_bonus 对应的 modifier）。
# 使用前需确保 SparrowSync 的 data-types.health 与 data-types.attributes 为 true，
# 并把 LuckyPeachesWorldMax 加入 attributes.modifier-blacklist（世界专属，不能跨服）。
sparrow_sync_delegate_health: false

settings:
  # 调试模式
  debug: false
  # 登录时设置基础最大生命值（≤0 禁用）
  base_max_health: 20.0
  # 是否无条件接管基础最大生命值：
  # false = 仅当基础值仍为原版默认(20) 时才设置，避免覆盖其它插件通过 setBaseValue 设置的基础生命
  # true  = 每次登录都强制设为 base_max_health（旧行为）
  force_base_max_health: false
  # 登录血量补回延迟（tick）：其它插件的最大生命加成通常晚于本插件应用，
  # 若登录时血量被当前上限夹低，会在该延迟后补回到记录值（期间受到真实伤害则不补）
  join_health_restore_delay_ticks: 40
  # 数据库配置
  database:
    # 数据库类型: sqlite 或 mysql
    type: sqlite
    # MySQL 配置（仅 type: mysql 时生效）
    # 使用 MySQL 时，玩家数据共享，配置从共享目录读取
    mysql:
      host: localhost
      port: 3306
      database: luckypeaches
      username: root
      password: ""
      table_prefix: "lp_"
      max_connections: 10
  # 本地备份设置
  database_backup:
    enabled: true
    # 自动备份间隔（小时），最小 1
    backup_interval_hours: 1
    # 最多保留的备份份数，最小 1
    max_backups: 7
    backup_folder: "backups"
    # MySQL 模式的导出格式: yml 或 json
    format: yml

# 以下是 SQLite 模式的默认配置
# MySQL 模式下会从代理端自动同步，无需手动配置

  max_health_limit: 250
  vip_health_limits:
    vip: 10000
  death_penalty:
    enabled: true
    health_threshold: 200.0
    # 死亡冷却（毫秒）：冷却期内再次死亡不扣罚。已持久化到数据库（跨服共享），
    # 可拦截"假死/切服导致同一次死亡在两个服各扣一次"；建议大于一次切服的耗时（如 15000）
    death_cooldown_ms: 5000
    restore_delay_ticks: 2
    penalty_groups:
      default:
        penalty_percentage: 0.01
        min_penalty: 1.0
        max_penalty: 200.0
      vip:
        penalty_percentage: 0.008
        min_penalty: 0.5
        max_penalty: 150.0
      svip:
        penalty_percentage: 0.005
        min_penalty: 0.2
        max_penalty: 100.0
  success_sound: ENTITY_PLAYER_LEVELUP
  fail_sound: BLOCK_GLASS_BREAK
  enable_particles: true
  health_scaling:
    enable: true
    scale: 20.0

world_integration:
  enabled: true
  disabled_worlds:
    - "world_pvp"
    - "world_arena"
  restore_full_health_on_enter: true
  restore_health_delay_ticks: 60
  peach_restore_delay_ticks: 60
  restore_full_health_on_exit: true

world_max_health:
  enabled: true
  worlds:
    pvp: 500.0
