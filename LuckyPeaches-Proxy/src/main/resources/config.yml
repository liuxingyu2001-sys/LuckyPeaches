# LuckyPeaches-Proxy 配置文件
# 此配置会同步到 MySQL，后端服务器启动时从 MySQL 读取

# ========== 数据库连接 ==========
# 仅代理端使用，不会同步到后端
database:
  host: localhost
  port: 3306
  database: luckypeaches
  username: root
  password: ""
  table_prefix: "lp_"

# ========== 同步配置 ==========
# 以下配置会同步到 MySQL，后端服务器自动读取
# 结构与后端 config.yml 保持一致

settings:
  # 基础最高总生命值
  max_health_limit: 250

  # VIP 额外生命值上限配置
  vip_health_limits:
    vip: 10000

  # 死亡惩罚设置
  death_penalty:
    enabled: true
    health_threshold: 200.0
    death_cooldown_ms: 5000
    restore_delay_ticks: 2
    penalty_groups:
      default:
        penalty_percentage: 0.01
        min_penalty: 1.0
        max_penalty: 200.0
      vip:
        penalty_percentage: 0.008
        min_penalty: 0.5
        max_penalty: 150.0
      svip:
        penalty_percentage: 0.005
        min_penalty: 0.2
        max_penalty: 100.0

  # 音效设置
  success_sound: ENTITY_PLAYER_LEVELUP
  fail_sound: BLOCK_GLASS_BREAK
  enable_particles: true

  # 血量缩放设置
  health_scaling:
    enable: true
    scale: 20.0

# 世界屏蔽集成设置
world_integration:
  enabled: true
  disabled_worlds:
    - "world_pvp"
    - "world_arena"
  restore_full_health_on_enter: true
  restore_health_delay_ticks: 60
  peach_restore_delay_ticks: 60
  restore_full_health_on_exit: true

# 世界最大生命值设置
world_max_health:
  enabled: true
  worlds:
    pvp: 500.0

# 蟠桃配置
peaches:
  peach_1:
    display_name: "&6蟠桃"
    material: APPLE
    lore:
      - "&7一颗神奇的蟠桃"
      - "&e有 10% 概率增加 0.5 点生命上限"
    health_bonus: 0.5
    chance: 0.1
    custom_model_data: 0
  peach_2:
    display_name: "&d优质蟠桃"
    material: CHORUS_FRUIT
    lore:
      - "&7极其罕见的仙桃"
      - "&e有 50% 概率增加 1 点生命上限"
    health_bonus: 1.0
    chance: 0.5
    custom_model_data: 1
  peach_3:
    display_name: "&6极品蟠桃"
    material: GOLDEN_APPLE
    lore:
      - "&7一颗神奇的蟠桃"
      - "&e有 100% 概率增加 0.5 点生命上限"
    health_bonus: 0.5
